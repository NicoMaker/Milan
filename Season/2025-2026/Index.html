<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rosa A.C. Milan 2025/26 — Archivio Rose</title>
  <meta name="description" content="Rosa completa dell'A.C. Milan nella stagione 2025/26: ruolo, numero di maglia, data di nascita e nazionalità di ogni giocatore." />
  <meta name="theme-color" content="#0c0c0e" />
  <link rel="icon" type="image/png" href="https://logodetimes.com/times/milan/logo-milan-4096.png" />

  <!-- Meta tag per l'anno di inizio stagione (usato per il calcolo dell'età) -->
  <meta name="season-start-year" content="2025" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../assets/css/tokens.css" />
  <link rel="stylesheet" href="../../assets/css/season.css" />
  <script src="../../assets/js/season.js" defer></script>
</head>
<body>
  <div class="app-header">
    <header class="site-header">
      <a class="back-link" href="../../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Archivio</span>
      </a>
      <img src="https://logodetimes.com/times/milan/logo-milan-4096.png" alt="Stemma A.C. Milan" width="38" height="38" />
      <h1>A.C. Milan 2025/26</h1>
    </header>

    <nav class="filters" aria-label="Ricerca e filtri rosa">
      <div class="search-container">
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="search-input"
            placeholder="Cerca giocatore, numero o nazionalità…"
            aria-label="Cerca giocatore"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="search-suggestions"
          />
          <div id="search-suggestions" class="search-suggestions hidden" role="listbox"></div>
        </div>
        <button id="search-button" aria-label="Cerca">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">Tutti</button>
        <button class="filter-btn" data-filter="Portiere" aria-pressed="false">Portieri</button>
        <button class="filter-btn" data-filter="Difensore" aria-pressed="false">Difensori</button>
        <button class="filter-btn" data-filter="Centrocampista" aria-pressed="false">Centrocampisti</button>
        <button class="filter-btn" data-filter="Attaccante" aria-pressed="false">Attaccanti</button>
      </div>
    </nav>
  </div>

  <main>
    <div id="loading-indicator" class="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Sto sfogliando la rosa…</p>
    </div>

    <div id="no-results" class="no-results hidden" aria-live="polite">
      <p>Nessun giocatore trovato. Prova con un'altra ricerca.</p>
    </div>

    <div id="roles-container" aria-live="polite">
      <!-- Le sezioni per ruolo vengono generate qui da assets/js/season.js -->
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> A.C. Milan — Tutti i diritti riservati</p>
    <div class="social-links">
      <a href="https://www.facebook.com/ACMilan" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
        </svg>
      </a>
      <a href="https://www.instagram.com/acmilan" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="https://twitter.com/acmilan" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"></path>
        </svg>
      </a>
    </div>
  </footer>

  <template id="player-card-template">
    <div class="card" tabindex="0" role="button" aria-label="Mostra i dettagli del giocatore">
      <div class="card-front">
        <img class="card-img" alt="" />
        <div class="card-content">
          <h3></h3>
          <div class="maglia"></div>
        </div>
      </div>
      <div class="card-back">
        <h3></h3>
        <p class="birth-date"></p>
        <div class="nationality"></div>
        <p class="role"></p>
        <div class="maglia"></div>
      </div>
    </div>
  </template>
</body>
</html>
