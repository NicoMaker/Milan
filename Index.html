<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archivio Rose A.C. Milan</title>
    <meta
      name="description"
      content="Sfoglia le rose storiche dell'A.C. Milan stagione per stagione: posizione in classifica, competizioni disputate e rosa completa."
    />
    <meta name="theme-color" content="#0c0c0e" />
    <link
      rel="icon"
      type="image/png"
      href="https://logodetimes.com/times/milan/logo-milan-4096.png"
    />

    <meta property="og:title" content="Archivio Rose A.C. Milan" />
    <meta
      property="og:description"
      content="Sfoglia le rose storiche dell'A.C. Milan stagione per stagione."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/base/foundation.css" />
    <link rel="stylesheet" href="styles/components/header-home.css" />
    <link rel="stylesheet" href="styles/components/loading-state.css" />
    <link rel="stylesheet" href="styles/components/timeline.css" />
    <link rel="stylesheet" href="styles/components/footer.css" />
    <link rel="stylesheet" href="styles/pages/home.css" />
    <link rel="stylesheet" href="styles/responsive/home-responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <img
        class="crest"
        src="https://logodetimes.com/times/milan/logo-milan-4096.png"
        alt="Stemma A.C. Milan"
        width="44"
        height="44"
      />
      <div class="header-text">
        <span class="eyebrow">Dal 2024 a oggi</span>
        <h1>Archivio Rose</h1>
      </div>
    </header>

    <main>
      <p class="page-intro">
        Ogni stagione rossonera con posizione finale, competizioni disputate e
        rosa completa dei giocatori.
      </p>

      <div id="loading-container" class="loading-container">
        <div class="spinner" aria-hidden="true"></div>
        <p>Stiamo raccogliendo le stagioni…</p>
      </div>

      <div class="timeline" id="timeline" aria-live="polite">
        <!-- Le stagioni vengono generate qui da assets/js/home.js -->
      </div>
    </main>

    <footer class="site-footer">
      <p>
        &copy; <span id="current-year"></span> Archivio Rose A.C. Milan — Tutti
        i diritti riservati
      </p>
      <div class="social-links">
        <a
          href="https://www.facebook.com/ACMilan"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"
            ></path>
          </svg>
        </a>
        <a
          href="https://www.instagram.com/acmilan"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <a
          href="https://twitter.com/acmilan"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Twitter"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"
            ></path>
          </svg>
        </a>
      </div>
    </footer>

    <script src="assets/js/home/01-core.js" defer></script>
    <script src="assets/js/home/02-timeline.js" defer></script>
    <script src="assets/js/home/03-bootstrap.js" defer></script>
  </body>
</html>
